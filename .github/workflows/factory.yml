name: factory

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate example config
        run: node scripts/validate-config.mjs config/client.example.json

      - name: Unit tests (ЕИК and VIES)
        run: node --test scripts/lib/*.test.mjs

      - name: Env vars and code agree
        run: |
          # The scripts told operators to put credentials in .env while nothing
          # loaded that file, so following the instruction changed nothing.
          # Check both directions: every variable the code reads is documented,
          # and every Shopify variable that is documented is read.
          #
          # Test files are excluded: they set variables of their own (a TLS
          # switch, for one) that no operator ever sets, and requiring those in
          # .env.example would document them as configuration.
          fail=0

          for key in $(grep -rho "process\.env\.[A-Z_][A-Z0-9_]*" scripts/ --include=*.mjs \
                       --exclude=*.test.mjs \
                       | sed 's/process\.env\.//' | sort -u); do
            if ! grep -q "^$key=" .env.example; then
              echo "Read by the code but not documented in .env.example: $key"
              fail=1
            fi
          done

          # The AI provider keys are documented as belonging to the agent, not
          # to these scripts, so they are deliberately not read here.
          for key in SHOPIFY_STORE_DOMAIN SHOPIFY_ADMIN_TOKEN SHOPIFY_CLI_THEME_TOKEN; do
            if ! grep -rq "process\.env\.$key" scripts/ --include=*.mjs --exclude=*.test.mjs; then
              echo "Documented for the scripts but never read: $key"
              fail=1
            fi
          done

          exit $fail

      - name: Credential scripts fail fast instead of hanging
        run: |
          # push-theme ran `npx shopify`, which downloads a package and then
          # waits on an interactive login that never arrives in an agent. It
          # hung indefinitely. Without a token it must now exit non-zero fast.
          start=$(date +%s)
          set +e
          node scripts/push-theme.mjs config/client.example.json > /dev/null 2>&1
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          if [ "$status" -eq 0 ]; then
            echo "push-theme reported success with no credentials"; exit 1
          fi
          if [ "$elapsed" -gt 30 ]; then
            echo "push-theme took ${elapsed}s without credentials; it should fail fast"; exit 1
          fi
          echo "push-theme failed fast in ${elapsed}s with status $status"

      - name: Credential scripts do not print stack traces
        run: |
          # A rejected token must read as an instruction, not a crash.
          # The config names the store, so the .env domain has to agree with it
          # or the domain guard answers first and the token path is never
          # reached. test.myshopify.com is a real store that answers 401.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config/client.example.json', 'utf8'));
            c.store.domain = 'test.myshopify.com';
            fs.writeFileSync('/tmp/stacktrace-config.json', JSON.stringify(c, null, 2) + '\n');
          "
          printf 'SHOPIFY_STORE_DOMAIN=test.myshopify.com\nSHOPIFY_ADMIN_TOKEN=fake\n' > .env
          set +e
          out=$(node scripts/import-products.mjs /tmp/stacktrace-config.json 2>&1)
          set -e
          rm -f .env /tmp/stacktrace-config.json
          if echo "$out" | grep -q "at async file:"; then
            echo "import-products printed a stack trace:"; echo "$out"; exit 1
          fi
          if ! echo "$out" | grep -q "SHOPIFY_ADMIN_TOKEN"; then
            echo "The error does not name the variable to fix:"; echo "$out"; exit 1
          fi
          echo "import-products reports a rejected token clearly"

      - name: Build store package
        run: node scripts/build-store.mjs config/client.example.json

      - name: Check generated artifacts
        run: |
          test -f dist/example-firm/products.csv
          test -f dist/example-firm/theme-settings.json
          test -f dist/example-firm/manifest.json
          test -f dist/example-firm/HANDOFF.md
          test -d dist/example-firm/legal
          ls dist/example-firm/legal

      - name: Check landing bundle renders with no placeholders
        run: |
          test -f dist/example-firm/landing/index.html
          test -f dist/example-firm/landing/api/buy.js
          if grep -q '{{' dist/example-firm/landing/index.html; then
            echo "Unrendered placeholder in landing output"; exit 1
          fi

      - name: Check handoff has no placeholders
        run: |
          if grep -q '{{' dist/example-firm/HANDOFF.md; then
            echo "Unrendered placeholder in handoff"; exit 1
          fi

      - name: QA (non-blocking for known gaps)
        run: node scripts/qa-check.mjs config/client.example.json || true

      - name: Assert legal pages carry the DRAFT stamp
        run: |
          grep -q "ЧЕРНОВА" dist/example-firm/legal/obshti-usloviya.html
          grep -q "ЧЕРНОВА" dist/example-firm/legal/poveritelnost.html

      - name: The whole pipeline runs from a portal request
        run: |
          # The operator's path is request -> config -> build -> QA. This drives
          # it end to end so a break in the bridge is caught here, not tomorrow
          # in front of a client.
          node scripts/new-client.mjs examples/request.example.json
          test -f config/primeren-klient.json
          test -f dist/primeren-klient/products.csv
          echo "request -> config -> build completed"

      - name: QA refuses a store that still has placeholders
        run: |
          # A fresh client config is full of TODOs. QA must flag them, not pass
          # them, or a store with a 0.00 product can be handed over as ready.
          if node scripts/qa-check.mjs config/primeren-klient.json; then
            echo "QA passed a store with unfilled placeholders"; exit 1
          fi
          node scripts/qa-check.mjs config/primeren-klient.json | grep -q "price above zero"
          echo "QA blocked the placeholder store"

      - name: A completed client config passes QA
        run: |
          # The mirror of the previous check: once the placeholders are gone,
          # QA must be clean. Otherwise the block above is just noise.
          node -e "
            const fs = require('fs');
            const p = 'config/primeren-klient.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.brand.tagline = 'Ръчно изработени продукти от България';
            c.store.usps = ['Безплатна доставка над 100 лв.'];
            c.collections = [{ handle: 'vsički', title: 'Всички', products: [c.products[0].handle] }];
            c.integrations.ga4 = 'G-TEST00000';
            Object.assign(c.products[0], {
              title: 'Примерен продукт',
              price: 24.9,
              shortDescription: 'Кратко описание.',
              description: 'Пълно описание на продукта.',
              images: ['clients/primeren-klient/products/1-1.jpg'],
            });
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
          node scripts/qa-check.mjs config/primeren-klient.json
          echo "a completed config passes QA"

      - name: QA refuses a landing store with no linked variants
        run: |
          # A landing store sells through /api/buy, which needs a variant id per
          # product. Without them the bundle ships an empty product list and
          # every buy button fails, while QA used to report the store as nearly
          # ready. This is the trap that matters most for a landing store.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config/primeren-klient.json', 'utf8'));
            c.store.type = 'landing';
            c.integrations.ga4 = 'G-TEST00000';
            c.brand.tagline = 'Ръчно изработени продукти';
            Object.assign(c.products[0], {
              title: 'Примерен продукт', price: 24.9,
              shortDescription: 'Кратко описание.', description: 'Пълно описание.',
              images: ['clients/primeren-klient/products/1-1.jpg'],
            });
            fs.writeFileSync('config/primeren-klient.json', JSON.stringify(c, null, 2) + '\n');
          "
          if node scripts/qa-check.mjs config/primeren-klient.json; then
            echo "QA passed a landing store that cannot sell"; exit 1
          fi
          node scripts/qa-check.mjs config/primeren-klient.json | grep -q "linked to Shopify variants"
          echo "QA blocked the unlinked landing store"

      - name: Deploy refuses a config whose store is not the one in .env
        run: |
          # One .env serves every client, but each config names its own store.
          # Without this check the import of one client could write into the
          # store of another, which cannot be undone from the config side.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config/primeren-klient.json', 'utf8'));
            c.store.domain = 'primeren-klient.myshopify.com';
            fs.writeFileSync('config/primeren-klient.json', JSON.stringify(c, null, 2) + '\n');
          "
          if SHOPIFY_STORE_DOMAIN=other-client.myshopify.com SHOPIFY_ADMIN_TOKEN=shpat_x \
             node scripts/deploy.mjs config/primeren-klient.json; then
            echo "deploy wrote to a store the config does not name"; exit 1
          fi
          echo "deploy refused the mismatched store"

      - name: Deploy refuses to import while QA has blockers
        run: |
          # An import is a write to a real store. A product with a TODO title
          # and a 0.00 price becomes junk the operator deletes by hand, so QA
          # has to gate the import rather than follow it.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config/primeren-klient.json', 'utf8'));
            c.products[0].price = 0;
            c.products[0].title = 'TODO продукт';
            fs.writeFileSync('config/primeren-klient.json', JSON.stringify(c, null, 2) + '\n');
          "
          if SHOPIFY_STORE_DOMAIN=primeren-klient.myshopify.com SHOPIFY_ADMIN_TOKEN=shpat_x \
             node scripts/deploy.mjs config/primeren-klient.json; then
            echo "deploy imported a store QA rejects"; exit 1
          fi
          node scripts/deploy.mjs config/primeren-klient.json 2>&1 | grep -q "nothing was sent to Shopify"
          echo "deploy refused the blocked import"

      - name: No test artifacts are left behind
        run: |
          # The pipeline above writes a client config and a dist tree. Neither
          # belongs in the repository.
          if git ls-files --error-unmatch config/primeren-klient.json >/dev/null 2>&1; then
            echo "a generated client config is tracked by git"; exit 1
          fi
          if ! grep -q '^config/\*\.json' .gitignore; then
            echo "generated configs are not gitignored"; exit 1
          fi
          echo "generated configs are untracked and ignored"
