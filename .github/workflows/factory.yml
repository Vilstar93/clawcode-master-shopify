name: factory

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate example config
        run: node scripts/validate-config.mjs config/client.example.json

      - name: Unit tests (ЕИК and VIES)
        run: node --test scripts/lib/*.test.mjs

      - name: Env vars and code agree
        run: |
          # The scripts told operators to put credentials in .env while nothing
          # loaded that file, so following the instruction changed nothing.
          # Check both directions: every variable the code reads is documented,
          # and every Shopify variable that is documented is read.
          fail=0

          for key in $(grep -rho "process\.env\.[A-Z_][A-Z0-9_]*" scripts/ --include=*.mjs \
                       | sed 's/process\.env\.//' | sort -u); do
            if ! grep -q "^$key=" .env.example; then
              echo "Read by the code but not documented in .env.example: $key"
              fail=1
            fi
          done

          # The AI provider keys are documented as belonging to the agent, not
          # to these scripts, so they are deliberately not read here.
          for key in SHOPIFY_STORE_DOMAIN SHOPIFY_ADMIN_TOKEN SHOPIFY_CLI_THEME_TOKEN; do
            if ! grep -rq "process\.env\.$key" scripts/ --include=*.mjs; then
              echo "Documented for the scripts but never read: $key"
              fail=1
            fi
          done

          exit $fail

      - name: Credential scripts fail fast instead of hanging
        run: |
          # push-theme ran `npx shopify`, which downloads a package and then
          # waits on an interactive login that never arrives in an agent. It
          # hung indefinitely. Without a token it must now exit non-zero fast.
          start=$(date +%s)
          set +e
          node scripts/push-theme.mjs config/client.example.json > /dev/null 2>&1
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          if [ "$status" -eq 0 ]; then
            echo "push-theme reported success with no credentials"; exit 1
          fi
          if [ "$elapsed" -gt 30 ]; then
            echo "push-theme took ${elapsed}s without credentials; it should fail fast"; exit 1
          fi
          echo "push-theme failed fast in ${elapsed}s with status $status"

      - name: Credential scripts do not print stack traces
        run: |
          # A rejected token must read as an instruction, not a crash.
          printf 'SHOPIFY_STORE_DOMAIN=test.myshopify.com\nSHOPIFY_ADMIN_TOKEN=fake\n' > .env
          set +e
          out=$(node scripts/import-products.mjs config/client.example.json 2>&1)
          set -e
          rm -f .env
          if echo "$out" | grep -q "at async file:"; then
            echo "import-products printed a stack trace:"; echo "$out"; exit 1
          fi
          if ! echo "$out" | grep -q "SHOPIFY_ADMIN_TOKEN"; then
            echo "The error does not name the variable to fix:"; echo "$out"; exit 1
          fi
          echo "import-products reports a rejected token clearly"

      - name: Build store package
        run: node scripts/build-store.mjs config/client.example.json

      - name: Check generated artifacts
        run: |
          test -f dist/example-firm/products.csv
          test -f dist/example-firm/theme-settings.json
          test -f dist/example-firm/manifest.json
          test -f dist/example-firm/HANDOFF.md
          test -d dist/example-firm/legal
          ls dist/example-firm/legal

      - name: Check landing bundle renders with no placeholders
        run: |
          test -f dist/example-firm/landing/index.html
          test -f dist/example-firm/landing/api/buy.js
          if grep -q '{{' dist/example-firm/landing/index.html; then
            echo "Unrendered placeholder in landing output"; exit 1
          fi

      - name: Check handoff has no placeholders
        run: |
          if grep -q '{{' dist/example-firm/HANDOFF.md; then
            echo "Unrendered placeholder in handoff"; exit 1
          fi

      - name: QA (non-blocking for known gaps)
        run: node scripts/qa-check.mjs config/client.example.json || true

      - name: Assert legal pages carry the DRAFT stamp
        run: |
          grep -q "ЧЕРНОВА" dist/example-firm/legal/obshti-usloviya.html
          grep -q "ЧЕРНОВА" dist/example-firm/legal/poveritelnost.html
